name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
  PROBLEM_TYPES_URL: ${{ vars.PROBLEM_TYPES_URL || 'https://raw.githubusercontent.com/rodrigolutfydev/Ticketfy-API/main/docs/problem-types.json' }}
  EVENT_CATEGORIES_URL: ${{ vars.EVENT_CATEGORIES_URL || 'https://raw.githubusercontent.com/rodrigolutfydev/Ticketfy-API/main/docs/event-categories.json' }}

jobs:
  build:
    name: Verificar e gerar build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node (versão do .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Conferir variáveis obrigatórias
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Variável VITE_API_URL não cadastrada (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) echo "VITE_API_URL=$VITE_API_URL" ;;
            *) echo "::error::VITE_API_URL precisa ser https: $VITE_API_URL"; exit 1 ;;
          esac
          case "$VITE_GOOGLE_CLIENT_ID" in
            "") echo "::warning::Variável VITE_GOOGLE_CLIENT_ID não cadastrada: o botão Entrar com o Google não vai aparecer." ;;
            GOCSPX-*) echo "::error::VITE_GOOGLE_CLIENT_ID recebeu o client secret do Google. Cadastre o client ID; o secret fica só na API."; exit 1 ;;
            *) echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID" ;;
          esac

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Conferir contratos com a API
        run: npm run check:problems

      - name: Build de produção
        run: npm run build

      - name: Conferir o dist/
        run: npm run check:dist

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Guardar o dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Publicar na Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    outputs:
      site_url: ${{ vars.SITE_URL }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar o Node (versão do .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Conferir configuração do deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Secret CLOUDFLARE_API_TOKEN não cadastrado no environment production."; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Variável CLOUDFLARE_ACCOUNT_ID não cadastrada."; missing=1; }
          [ -n "$CF_PAGES_PROJECT" ] || { echo "::error::Variável CF_PAGES_PROJECT não cadastrada."; missing=1; }
          [ -n "$SITE_URL" ] || { echo "::error::Variável SITE_URL não cadastrada no environment production."; missing=1; }
          exit $missing

      - name: Instalar dependências
        run: npm ci

      - name: Baixar o dist/ verificado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Conferir o dist/ de novo
        run: npm run check:dist

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: npx --no-install wrangler pages deploy dist --project-name="$CF_PAGES_PROJECT" --branch=main --commit-hash="$GITHUB_SHA"

  smoke:
    name: Teste rápido do site publicado
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Baixar o dist/ publicado
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Rodar as checagens
        env:
          SITE_URL: ${{ needs.deploy.outputs.site_url }}
        run: |
          EXPECTED_ENTRY="$(grep -o 'src="/assets/[^"]*\.js"' dist/index.html | head -1 | sed 's/^src="//; s/"$//')"
          export EXPECTED_ENTRY
          bash scripts/smoke-test.sh
